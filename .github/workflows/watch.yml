name: Self-maintenance watch

# The loop this workflow implements:
#   Observe  -> every scheduled run exercises dependencies, build, docs and the
#               live deployment, so decay is found by the calendar, not by the
#               next person who happens to push.
#   Diagnose -> each check prints a reason code, never a credential or a body.
#   Propose  -> a failing check opens ONE issue with a stable title. A repeat
#               failure comments on that issue instead of opening a duplicate.
#   Validate -> the proposed fix must still pass `Check and deploy` (which runs
#               on every pull request). This workflow never edits code.
#   Approve  -> a human merges; nothing here has `contents: write`.
#   Verify   -> the post-deploy smoke test in ci.yml re-probes the real site.
#
# Deliberate limits: read-only token, no auto-commit, no auto-merge of majors,
# no production deploy. Automation observes and reports; it does not decide.

on:
  schedule:
    # Mondays 04:17 UTC, before the working week, after Dependabot's Monday run.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: self-maintenance-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Area 2 — dependencies. A lockfile that was safe last month may not be
      # today; this is the only check that can fail on an untouched repository.
      - name: Dependency audit
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high

      # Area 2 — dependencies. Unpinned drift, reported, never auto-applied.
      - name: Outdated report
        id: outdated
        continue-on-error: true
        run: npm outdated --long 2>&1 | tee outdated.txt; test "${PIPESTATUS[0]}" -eq 0

      # Area 1 + 3 — tests and code quality on today's toolchain.
      - name: Lint, typecheck, tests and build
        id: quality
        continue-on-error: true
        run: npm run check

      # Area 4 — documentation. Proves the docs still describe this code.
      - name: Documentation drift guard
        id: docs
        continue-on-error: true
        run: node scripts/check-docs.mjs

      # Area 5 — operational health of the real deployment, not of a build.
      # A green CI run says the artifact was built; only this says it is served.
      - name: Live site smoke test
        id: live
        continue-on-error: true
        env:
          PAGE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          API_BASE: ${{ vars.API_BASE }}
          SMOKE_STRICT_IDENTITY: '1'
        run: node scripts/smoke-deploy.mjs "$PAGE_URL" ${API_BASE:+"$API_BASE"}

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Self-maintenance watch"
            echo ""
            echo "| area | result |"
            echo "| --- | --- |"
            echo "| dependencies (audit) | ${{ steps.audit.outcome }} |"
            echo "| dependencies (outdated) | ${{ steps.outdated.outcome }} |"
            echo "| tests / code quality | ${{ steps.quality.outcome }} |"
            echo "| documentation | ${{ steps.docs.outcome }} |"
            echo "| operational health | ${{ steps.live.outcome }} |"
            echo ""
            echo "Read-only by design: this run cannot modify the repository."
          } >> "$GITHUB_STEP_SUMMARY"
          [ -f outdated.txt ] && { echo '```'; head -40 outdated.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true

      # Area 5 + 6 — make decay visible where a human will see it, using the
      # existing issue tracker rather than a mail nobody reads.
      - name: Open or update the maintenance issue
        if: failure() || steps.audit.outcome == 'failure' || steps.quality.outcome == 'failure' || steps.docs.outcome == 'failure' || steps.live.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Weekly self-maintenance check failed"
          BODY="$(printf '%s\n' \
            "An automated, read-only maintenance run found a problem. Nothing was changed." \
            "" \
            "| check | result |" \
            "| --- | --- |" \
            "| dependency audit | ${{ steps.audit.outcome }} |" \
            "| outdated packages | ${{ steps.outdated.outcome }} |" \
            "| lint / types / tests / build | ${{ steps.quality.outcome }} |" \
            "| documentation drift | ${{ steps.docs.outcome }} |" \
            "| live site smoke test | ${{ steps.live.outcome }} |" \
            "" \
            "Run: $RUN_URL" \
            "" \
            "**Repair path:** reproduce locally with \`npm ci && npm run check && node scripts/check-docs.mjs\`," \
            "then open a pull request. Merging still requires a green \`quality\` job." \
            "This issue is evidence, not a fix: close it only after a run passes.")"
          EXISTING="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
