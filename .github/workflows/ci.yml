name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - name: Reject committed secrets and client-side key prefixes
        run: node scripts/guard-secrets.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      # The deploy job rebuilds with the hosting identity of the target, so this
      # build output has no consumer. Uploading it only spent the 500 MB shared
      # Actions/Packages storage allowance. Assert the output instead.
      - name: Assert the build output exists and fits Pages limits
        run: node scripts/check-build.mjs

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-production
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build with the identity of this repository
        env:
          # Derived from the live GitHub context: a rename needs no code change.
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          VITE_SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          VITE_API_BASE: ${{ vars.API_BASE }}
          VITE_BRAND_AR: ${{ vars.BRAND_AR }}
          VITE_BRAND_LATIN: ${{ vars.BRAND_LATIN }}
          SITE_BASE: ${{ vars.SITE_BASE }}
          SITE_CNAME: ${{ vars.SITE_CNAME }}
        run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Smoke test the published site
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          API_BASE: ${{ vars.API_BASE }}
          # A rename or domain move must not leave a stale canonical behind.
          SMOKE_STRICT_IDENTITY: '1'
        run: |
          node scripts/smoke-deploy.mjs "$PAGE_URL" "$API_BASE" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Report a failed deployment
        if: failure()
        run: |
          echo "::error::Deployment smoke test failed. Re-run the last known-good commit from Actions to roll back."
          echo "Rollback: git revert the offending merge, or re-run the previous successful deploy run." >> "$GITHUB_STEP_SUMMARY"
