name: Groq live smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Optional Groq model override. Leave empty to use GROQ_MODEL or the default.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: groq-live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Call Groq with a minimal non-sensitive prompt
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ github.event.inputs.model || vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
        run: |
          node --input-type=module <<'JS'
          const key = process.env.GROQ_API_KEY?.trim()
          if (!key) {
            console.error('GROQ_API_KEY secret is missing. Add it in repository Actions secrets.')
            process.exit(1)
          }

          const model = process.env.GROQ_MODEL?.trim() || 'openai/gpt-oss-120b'
          if (!/^[\w./-]{1,120}$/.test(model)) {
            console.error('Invalid GROQ_MODEL value.')
            process.exit(1)
          }

          try {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${key}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                model,
                messages: [
                  { role: 'system', content: 'Return only valid JSON. Do not include markdown.' },
                  { role: 'user', content: 'Reply with exactly this JSON object: {"ok":true}' },
                ],
                temperature: 0,
                max_completion_tokens: 32,
                response_format: { type: 'json_object' },
              }),
              signal: AbortSignal.timeout(20000),
            })

            console.log(`provider_status=${response.status}`)
            if (!response.ok) {
              console.error('Groq smoke request failed. Check the key, model, quota, and provider status.')
              process.exit(1)
            }

            let payload
            try {
              payload = await response.json()
            } catch {
              console.error('Groq returned an invalid JSON envelope.')
              process.exit(1)
            }

            const content = payload?.choices?.[0]?.message?.content
            if (typeof content !== 'string') {
              console.error('Groq returned no message content.')
              process.exit(1)
            }

            let result
            try {
              result = JSON.parse(content)
            } catch {
              console.error('Groq message content was not valid JSON.')
              process.exit(1)
            }

            if (result?.ok !== true) {
              console.error('Groq smoke response did not match the expected shape.')
              process.exit(1)
            }

            console.log('groq_smoke=passed')
          } catch {
            console.error('Groq smoke request timed out or could not reach the provider.')
            process.exit(1)
          }
          JS
