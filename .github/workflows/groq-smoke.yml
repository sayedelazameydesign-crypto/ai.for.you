name: Groq live smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Optional Groq model override. Leave empty to use GROQ_MODEL or the default.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: groq-live-smoke
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Call Groq with a minimal non-sensitive prompt
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ github.event.inputs.model || vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'

          // Report a machine-readable reason code. Never print the key, the
          // resolved model value, or any provider response body.
          const report = (ok, reason, hint = '') => {
            console.log(`groq_smoke=${ok ? 'passed' : 'failed'} reason=${reason}`)
            const summaryPath = process.env.GITHUB_STEP_SUMMARY
            if (summaryPath) {
              const lines = [
                '## Groq live smoke',
                '',
                `- result: **${ok ? 'passed' : 'failed'}**`,
                `- reason: \`${reason}\``,
              ]
              if (hint) lines.push(`- next step: ${hint}`)
              appendFileSync(summaryPath, lines.join('\n') + '\n')
            }
            if (!ok) {
              console.log(`::error title=Groq smoke failed::reason=${reason}${hint ? ' - ' + hint : ''}`)
              process.exit(1)
            }
          }

          const key = process.env.GROQ_API_KEY?.trim()
          if (!key) {
            report(false, 'missing_secret', 'Add GROQ_API_KEY under Settings > Secrets and variables > Actions.')
          }

          const model = process.env.GROQ_MODEL?.trim() || 'openai/gpt-oss-120b'
          if (!/^[\w./-]{1,120}$/.test(model)) {
            report(false, 'invalid_model', 'GROQ_MODEL may only contain letters, digits, dot, slash, underscore or dash.')
          }

          const httpHint = (status) => {
            if (status === 401 || status === 403) return 'The provider rejected the key. Check that it is valid and active.'
            if (status === 404) return 'The model was not found or is not enabled for this account.'
            if (status === 429) return 'Provider rate limit or quota reached. Retry later or review the account limits.'
            if (status >= 500) return 'The provider reported a server error. Retry later.'
            return 'Check the key, model, quota, and provider status.'
          }

          try {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${key}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                model,
                messages: [
                  { role: 'system', content: 'Return only valid JSON. Do not include markdown.' },
                  { role: 'user', content: 'Reply with exactly this JSON object: {"ok":true}' },
                ],
                temperature: 0.5,
                // Reasoning models spend hidden reasoning tokens from this same
                // budget. A tiny cap makes Groq abort JSON mode with HTTP 400
                // (json_validate_failed), so leave headroom.
                max_completion_tokens: 1024,
                ...(/^openai\/gpt-oss-/i.test(model)
                  ? { reasoning_effort: 'low', include_reasoning: false }
                  : {}),
                response_format: { type: 'json_object' },
              }),
              signal: AbortSignal.timeout(20000),
            })

            console.log(`provider_status=${response.status}`)
            if (!response.ok) {
              // Read only the provider's structured error identifiers. Never
              // print the message, the request, or the raw body.
              let code = ''
              try {
                const err = (await response.json())?.error
                for (const candidate of [err?.code, err?.type]) {
                  if (typeof candidate === 'string' && /^[\w.-]{1,64}$/.test(candidate)) {
                    code = `_${candidate}`
                    break
                  }
                }
              } catch {
                // Non-JSON error body: fall back to the status code alone.
              }
              report(false, `provider_http_${response.status}${code}`, httpHint(response.status))
            }

            let payload
            try {
              payload = await response.json()
            } catch {
              report(false, 'invalid_envelope', 'The provider returned a body that is not JSON.')
            }

            const content = payload?.choices?.[0]?.message?.content
            if (typeof content !== 'string') {
              report(false, 'no_content', 'The provider returned no message content.')
            }

            let result
            try {
              result = JSON.parse(content)
            } catch {
              report(false, 'invalid_json_content', 'The model did not return valid JSON. Try a model that supports JSON mode.')
            }

            if (result?.ok !== true) {
              report(false, 'unexpected_shape', 'The model returned JSON that does not match the expected shape.')
            }

            report(true, 'ok')
          } catch {
            report(false, 'network_or_timeout', 'The request timed out or the provider could not be reached.')
          }
          JS
